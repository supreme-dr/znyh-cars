{% extends 'base.html' %}
{% block title %}Book Test Drive — ZNYH Cars{% endblock %}

{% block content %}
<div class="container my-5" style="max-width:500px;">
    <h2 class="mb-3">Book a Test Drive</h2>
    <h5 class="text-muted mb-4">{{ car }}</h5>
    <form method="post" class="bg-light p-4 rounded shadow-sm">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Request Test Drive</button>
    </form>
</div>
{% endblock %}
